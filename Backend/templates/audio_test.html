<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audio test – Opus / test client</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #e0e0e0; margin: 20px; }
        h1 { font-size: 1.2rem; }
        a { color: #007bff; }
        .status { margin: 10px 0; padding: 8px; background: #2d2d2d; border-radius: 4px; }
        .log { max-height: 200px; overflow-y: auto; font-size: 0.85rem; font-family: monospace; background: #111; padding: 10px; border-radius: 4px; }
        .log div { margin: 2px 0; }
    </style>
</head>
<body>
    <h1>🐛 Audio test</h1>
    <p>Listen to audio streamed from the <strong>Opus test client</strong> (TesterAgent). Connect with <code>opus_tester.py</code>, then start listening below. Server console will show <code>[AI] Human detected</code> or <code>Speech buffered</code> when the Opus pipeline runs AMD.</p>
    <p><a href="/">← Back to dashboard</a></p>
    <div class="status" id="status">Connecting to server…</div>
    <button id="btn-listen" disabled>🎧 Start listening to TesterAgent</button>
    <div class="log" id="log"></div>
    <script>
        function getHost() { return window.location.host; }
        const adminId = "audio_test_" + Date.now();
        const wsUrl = "ws://" + getHost() + "/ws/admin/" + adminId;
        const ws = new WebSocket(wsUrl);
        const SAMPLE_RATE = 48000;
        let audioContext = null;
        let listening = false;
        const logEl = document.getElementById("log");
        const statusEl = document.getElementById("status");
        const btnListen = document.getElementById("btn-listen");
        function log(msg) {
            const line = document.createElement("div");
            line.textContent = new Date().toLocaleTimeString() + " " + msg;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
        }
        ws.onopen = function() {
            statusEl.textContent = "🟢 Connected";
            btnListen.disabled = false;
            ws.send(JSON.stringify({ type: "get_full_list" }));
            log("Connected. Click Start listening to hear TesterAgent (Opus test client).");
        };
        ws.onclose = function() {
            statusEl.textContent = "🔴 Disconnected";
            btnListen.disabled = true;
        };
        ws.onmessage = async function(event) {
            if (event.data instanceof Blob) {
                if (!listening || !audioContext) return;
                if (audioContext.state === "suspended") audioContext.resume();
                const buffer = await event.data.arrayBuffer();
                if (Math.random() < 0.02) log("🔊 RX " + buffer.byteLength + " bytes");
                const int16 = new Int16Array(buffer);
                const float32 = new Float32Array(int16.length);
                for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;
                const audioBuffer = audioContext.createBuffer(1, float32.length, SAMPLE_RATE);
                audioBuffer.copyToChannel(float32, 0);
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioContext.destination);
                source.start();
                return;
            }
            try {
                const msg = JSON.parse(event.data);
                if (msg.type === "agent_list") log("Agents: " + (msg.agents || []).map(a => a.agent_id).join(", ") || "none");
                if (msg.type === "listening_started") log("✅ Listening to " + (msg.agent_id || "agent"));
            } catch (e) {}
        };
        btnListen.onclick = function() {
            if (listening) {
                ws.send(JSON.stringify({ type: "stop_listening" }));
                listening = false;
                btnListen.textContent = "🎧 Start listening to TesterAgent";
                if (audioContext) audioContext.suspend();
                log("Stopped listening.");
            } else {
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
                audioContext.resume().then(function() {
                    ws.send(JSON.stringify({ type: "listen_to_agent", agent_id: "TesterAgent" }));
                    listening = true;
                    btnListen.textContent = "🛑 Stop listening";
                    log("Listening to TesterAgent (run opus_tester.py to send audio).");
                });
            }
        };
    </script>
</body>
</html>
