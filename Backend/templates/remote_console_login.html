<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remote Console Login</title>
    <link rel="stylesheet" href="/static/css/shared.css">
    <link rel="stylesheet" href="/static/css/remote_console.css">
</head>
<body class="remote-console-login">
    <div class="card">
        <h1>Remote Console Login</h1>
        <form method="post" action="/remote-console/login">
            <label>Password
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <label>Captcha: {{ captcha_question }}
                <input type="text" name="captcha_answer" autocomplete="off" required>
            </label>
            <input type="hidden" name="captcha_id" value="{{ captcha_id }}">
            <button type="submit">Login</button>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <div class="hint">Access is restricted. Use only on trusted network.</div>
        </form>
    </div>
</body>
</html>
