<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remote Console Login</title>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111; color: #eee; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1f1f1f; padding: 24px 28px; border-radius: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.4); width: 320px; border: 1px solid #333; }
        h1 { font-size: 1.2rem; margin: 0 0 12px 0; }
        label { display: block; margin-top: 12px; font-size: 0.9rem; color: #ccc; }
        input[type="password"], input[type="text"] { width: 100%; padding: 8px; margin-top: 4px; border-radius: 0; border: 1px solid #444; background: #111; color: #eee; box-sizing: border-box; }
        button { margin-top: 16px; width: 100%; padding: 10px; border: 1px solid #444; border-radius: 0; background: #1f1f1f; color: #eee; font-weight: 600; cursor: pointer; }
        button:hover { background: #2d2d2d; color: #fff; }
        .error { color: #ccc; font-size: 0.85rem; margin-top: 8px; }
        .hint { font-size: 0.8rem; color: #888; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Remote Console Login</h1>
        <form method="post" action="/remote-console/login">
            <label>Password
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <label>Captcha: {{ captcha_question }}
                <input type="text" name="captcha_answer" autocomplete="off" required>
            </label>
            <input type="hidden" name="captcha_id" value="{{ captcha_id }}">
            <button type="submit">Login</button>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <div class="hint">Access is restricted. Use only on trusted network.</div>
        </form>
    </div>
</body>
</html>
