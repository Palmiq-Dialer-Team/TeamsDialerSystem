<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/shared.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

    <!-- Sidebar for Exports -->
    <div class="sidebar">
        <h2>Data Export</h2>
        <p style="font-size: 0.8rem; color: #666; margin-bottom: 15px;">Download consolidated lists from all agents.</p>
        
        <label style="font-size: 0.85rem; color: #aaa; margin-bottom: 8px; display: block;">Filter by Agent:</label>
        <select id="agentExportFilter" style="width: 100%; padding: 8px; background: #333; color: white; border: 1px solid #444; border-radius: 4px; margin-bottom: 20px; font-size: 0.9rem;">
            <option value="ALL">All Agents</option>
        </select>
        
        <div style="margin-bottom: 10px;">
            <label style="font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 4px;">Date range:</label>
            <input type="date" id="exportStart" style="width: 100%; padding: 6px; margin-bottom: 6px; background: #333; color: white; border: 1px solid #444; border-radius: 4px; font-size: 0.85rem;">
            <input type="date" id="exportEnd" style="width: 100%; padding: 6px; background: #333; color: white; border: 1px solid #444; border-radius: 4px; font-size: 0.85rem;">
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px;">
            <button class="export-btn" style="flex: 1 1 48%; font-size: 0.75rem; padding: 6px;" onclick="setQuickRange('today')">Today</button>
            <button class="export-btn" style="flex: 1 1 48%; font-size: 0.75rem; padding: 6px;" onclick="setQuickRange('7d')">Last 7 Days</button>
            <button class="export-btn" style="flex: 1 1 48%; font-size: 0.75rem; padding: 6px;" onclick="setQuickRange('month')">This Month</button>
            <button class="export-btn" style="flex: 1 1 48%; font-size: 0.75rem; padding: 6px;" onclick="setQuickRange('all')">All Time</button>
        </div>
        
        <button class="export-btn" onclick="exportData('Booked Meeting')">Export “Booked Meeting”</button>
        <button class="export-btn" onclick="exportData('No Response')">Export “No Response”</button>
        <button class="export-btn" onclick="exportData('Sent Info')">Export “Sent Info”</button>
        <button class="export-btn" onclick="exportData('Not Interested')">Export “Not Interested”</button>
        <button class="export-btn" onclick="exportData('Call Back Later')">Export “Call Backs”</button>
        <button class="export-btn" onclick="exportData('Wrong Number')">Export “Wrong Number”</button>
        <button class="export-btn" onclick="exportData('Voicemail (Verified)')">Export “Voicemail (Verified)”</button>
        <button class="export-btn" onclick="exportData('Invalid Contact')">Export “Invalid Contact”</button>
        <hr style="border-color: #333; width: 100%;">
        <button class="export-btn" onclick="exportData('ALL')">Export full database</button>
    </div>

    <!-- Main Dashboard -->
    <div class="main">
        <div class="header">
            <h1>Live operations</h1>
            <div id="connection-status" style="color: #888;">
                <a href="/remote-console/login" title="Remote console (password protected)" style="text-decoration: none;">🟢</a>
                <span id="connection-status-text">Connecting to server...</span>
            </div>
        </div>
        <a href="/audio-test" title="Audio testing (Opus / test client)" style="position: fixed; top: 12px; right: 12px; font-size: 1.5rem; text-decoration: none; z-index: 100;">🐛</a>
        
        <div id="agents-grid" class="agent-grid">
            <!-- Agent Cards injected here via JS -->
        </div>
    </div>

    <script>
        function getServerHost() {
            // Trust the browser URL (e.g., 192.168.1.46:8080). 
            // IIS handles the mapping to the internal server.
            return window.location.host;
        }
        
        const agentsGrid = document.getElementById('agents-grid');
        const adminId = "admin_" + Date.now();
        const wsUrl = `ws://${getServerHost()}/ws/admin/${adminId}`;
        const ws = new WebSocket(wsUrl);
        
        let agentsData = {}; 
        let currentListening = null;
        let audioContext = null;
        const SAMPLE_RATE = 48000;
        
        // Throttle metadata updates to prevent constant re-rendering
        const updateThrottles = {};
        const THROTTLE_MS = 500; // Only update UI every 500ms max
        
        // Fetch agents on page load
        async function loadAgents() {
            try {
                const res = await fetch('/api/db_agents');
                const data = await res.json();
                const agentFilter = document.getElementById('agentExportFilter');
                
                // Clear existing options except "All Agents"
                agentFilter.innerHTML = '<option value="ALL">All Agents</option>';
                
                // Add agents to dropdown
                if (data.agents && data.agents.length > 0) {
                    data.agents.forEach(agent => {
                        const option = document.createElement('option');
                        option.value = agent;
                        option.textContent = agent;
                        agentFilter.appendChild(option);
                    });
                }
            } catch (e) {
                console.error('Error loading agents:', e);
            }
        }
        
        // Load agents when page loads
        loadAgents();
        
        function exportData(type) {
            const agentFilter = document.getElementById('agentExportFilter');
            const selectedAgent = agentFilter ? agentFilter.value : 'ALL';
            const startInput = document.getElementById('exportStart');
            const endInput = document.getElementById('exportEnd');
            const start = startInput && startInput.value ? startInput.value : null; // YYYY-MM-DD
            const end = endInput && endInput.value ? endInput.value : null;
            
            let url = `/api/export/${encodeURIComponent(type)}`;
            const params = [];
            if (selectedAgent && selectedAgent !== 'ALL') {
                params.push(`agent=${encodeURIComponent(selectedAgent)}`);
            }
            if (start) {
                params.push(`start=${encodeURIComponent(start)}`);
            }
            if (end) {
                params.push(`end=${encodeURIComponent(end)}`);
            }
            if (params.length > 0) {
                url += `?${params.join('&')}`;
            }
            window.location.href = url;
        }
        
        function setQuickRange(preset) {
            const startInput = document.getElementById('exportStart');
            const endInput = document.getElementById('exportEnd');
            const today = new Date();
            
            function formatDate(d) {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
            
            if (preset === 'all') {
                startInput.value = '';
                endInput.value = '';
                return;
            }
            
            if (preset === 'today') {
                const d = formatDate(today);
                startInput.value = d;
                endInput.value = d;
                return;
            }
            
            if (preset === '7d') {
                const endDate = new Date(today);
                const startDate = new Date(today);
                startDate.setDate(startDate.getDate() - 6); // include today + previous 6 days
                startInput.value = formatDate(startDate);
                endInput.value = formatDate(endDate);
                return;
            }
            
            if (preset === 'month') {
                const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
                startInput.value = formatDate(firstDay);
                endInput.value = formatDate(today);
            }
        }

        ws.onopen = () => {
            console.log("WS Connected");
            const statusEl = document.getElementById('connection-status-text');
            if (statusEl) {
                statusEl.innerText = "System Online";
            } else {
                document.getElementById('connection-status').innerText = "🟢 System Online";
            }
            ws.send(JSON.stringify({ type: "get_full_list" }));
        };
        ws.onclose = () => {
            const statusEl = document.getElementById('connection-status-text');
            if (statusEl) {
                statusEl.innerText = "Disconnected";
            } else {
                document.getElementById('connection-status').innerText = "🔴 Disconnected";
            }
        };

        ws.onmessage = async function(event) {
            if (event.data instanceof Blob) {
                handleAudio(event.data);
                return;
            }
            
            try {
                const msg = JSON.parse(event.data);
                
                if (msg.type === 'agent_list') {
                    msg.agents.forEach(agent => updateAgentState(agent.agent_id, agent));
                    msg.agents.forEach(agent => fetchStats(agent.agent_id));
                }
                else if (msg.type === 'agent_connected') {
                    updateAgentState(msg.agent_id, msg.metadata);
                    fetchStats(msg.agent_id);
                }
                else if (msg.type === 'agent_disconnected') {
                    if (agentsData[msg.agent_id]) {
                        agentsData[msg.agent_id].status = 'disconnected';
                        renderAgent(msg.agent_id);
                    }
                }
                else if (msg.type === 'agent_metadata_update') {
                    // Throttled in updateAgentState - won't spam re-renders
                    updateAgentState(msg.agent_id, msg.metadata);
                }
                else if (msg.type === 'stats_update') {
                    if (agentsData[msg.agent_id]) {
                        agentsData[msg.agent_id].stats = msg.stats;
                        renderAgent(msg.agent_id);
                    }
                }
                else if (msg.type === 'listening_started') {
                    console.log(`✅ Server confirmed: Listening to ${msg.agent_id}`);
                }
            } catch (e) { 
                console.error("Error parsing message:", e); 
            }
        };
        
        ws.onerror = function(error) {
            console.error("WebSocket error:", error);
        };
        
        // Use event delegation for button clicks (works even when buttons are recreated)
        agentsGrid.addEventListener('click', function(event) {
            const button = event.target.closest('.listen-btn');
            if (button && button.dataset.agentId) {
                const agentId = button.dataset.agentId;
                console.log(`Button clicked via event delegation for agent: ${agentId}`);
                toggleListen(agentId);
            }
        });

        async function fetchStats(agentId) {
            try {
                const res = await fetch(`/api/agent_stats/${agentId}`);
                const stats = await res.json();
                if (agentsData[agentId]) {
                    agentsData[agentId].stats = stats;
                    renderAgent(agentId);
                }
            } catch (e) { console.error(e); }
        }

        function updateAgentState(id, metadata) {
            if (!agentsData[id]) agentsData[id] = { stats: { calls_today: 0, calls_month: 0 }, status: 'connected' };
            
            // Check if this is just a last_audio update (not important for UI)
            const isOnlyLastAudio = Object.keys(metadata).length === 1 && metadata.hasOwnProperty('last_audio');
            
            // Update the data
            if (metadata.status) agentsData[id].status = metadata.status;
            agentsData[id].metadata = { ...agentsData[id].metadata, ...metadata };
            
            // Throttle re-renders: skip if it's just last_audio and we've updated recently
            const now = Date.now();
            const lastUpdate = updateThrottles[id] || 0;
            
            if (isOnlyLastAudio && (now - lastUpdate) < THROTTLE_MS) {
                // Skip rendering for frequent last_audio updates
                return;
            }
            
            // Important update - render it
            updateThrottles[id] = now;
            renderAgent(id);
        }

        function renderAgent(id) {
            const data = agentsData[id];
            if(!data) return;
            
            let card = document.getElementById(`card-${id}`);
            
            // Visual indicator for listening state
            const isListening = currentListening === id;
            const btnClass = isListening ? 'listen-btn active' : 'listen-btn';
            const btnText = isListening ? '🎧 Stop Listening' : '🔊 Listen In';
            
            // If card exists, try to update only specific elements instead of replacing everything
            if (card) {
                // Update status badge
                const statusBadge = card.querySelector('.status-badge');
                if (statusBadge) {
                    statusBadge.className = `status-badge ${data.status === 'connected' ? 'status-connected' : 'status-disconnected'}`;
                    statusBadge.textContent = data.status;
                }
                
                // Update live info
                const liveInfo = card.querySelector('.live-info');
                if (liveInfo) {
                    const statusSpan = liveInfo.querySelector('.info-row:nth-child(1) span:last-child');
                    const leadSpan = liveInfo.querySelector('.info-row:nth-child(2) span:last-child');
                    const contactSpan = liveInfo.querySelector('.info-row:nth-child(3) span:last-child');
                    
                    if (statusSpan) {
                        statusSpan.style.color = getStatusColor(data.metadata?.status);
                        statusSpan.textContent = data.metadata?.status || 'Idle';
                    }
                    if (leadSpan) leadSpan.textContent = data.metadata?.lead || '-';
                    if (contactSpan) contactSpan.textContent = data.metadata?.contact || '-';
                }
                
                // Update stats
                const statsRow = card.querySelector('.stats-row');
                if (statsRow) {
                    const todayStat = statsRow.querySelector('.stat-box:nth-child(1) .stat-num');
                    const monthStat = statsRow.querySelector('.stat-box:nth-child(2) .stat-num');
                    if (todayStat) todayStat.textContent = data.stats?.calls_today || 0;
                    if (monthStat) monthStat.textContent = data.stats?.calls_month || 0;
                }
                
                // Update button (only if state changed)
                const button = card.querySelector('.listen-btn');
                if (button) {
                    const currentIsListening = button.classList.contains('active');
                    if (currentIsListening !== isListening) {
                        button.className = btnClass;
                        button.textContent = btnText;
                    }
                }
                
                return; // Done with incremental update
            }
            
            // Card doesn't exist - create it
            const html = `
                <div class="card-header">
                    <div class="agent-name">${id}</div>
                    <div class="status-badge ${data.status === 'connected' ? 'status-connected' : 'status-disconnected'}">${data.status}</div>
                </div>
                <div class="live-info">
                    <div class="info-row"><span class="label">Status</span><span style="color: ${getStatusColor(data.metadata?.status)}">${data.metadata?.status || 'Idle'}</span></div>
                    <div class="info-row"><span class="label">Lead</span><span>${data.metadata?.lead || '-'}</span></div>
                    <div class="info-row"><span class="label">Contact</span><span>${data.metadata?.contact || '-'}</span></div>
                </div>
                <div class="stats-row">
                    <div class="stat-box"><span class="stat-num">${data.stats?.calls_today || 0}</span><span class="stat-label">Today</span></div>
                    <div class="stat-box"><span class="stat-num">${data.stats?.calls_month || 0}</span><span class="stat-label">Month</span></div>
                </div>
                <button id="btn-${id}" class="${btnClass}" data-agent-id="${id}">${btnText}</button>
            `;

            card = document.createElement('div');
            card.id = `card-${id}`;
            card.className = 'agent-card';
            card.innerHTML = html;
            agentsGrid.appendChild(card);
        }

        function getStatusColor(status) {
            if (!status) return '#fff';
            if (status.includes('Calling')) return '#ffc107';
            if (status.includes('Call Ended')) return '#ff453a';
            return '#2eea90';
        }

        // --- ROBUST AUDIO HANDLING ---
        function toggleListen(id) {
            console.log(`toggleListen called for agent: ${id}, currentListening: ${currentListening}`);
            
            if (currentListening === id) {
                console.log("Stopping listening...");
                ws.send(JSON.stringify({ type: "stop_listening" }));
                currentListening = null;
                if(audioContext) audioContext.suspend();
                renderAgent(id);
                console.log("Stopped listening.");
            } else {
                console.log(`Starting to listen to agent: ${id}`);
                
                // Check WebSocket state
                if (ws.readyState !== WebSocket.OPEN) {
                    console.error(`WebSocket not open! State: ${ws.readyState}`);
                    alert("WebSocket connection lost. Please refresh the page.");
                    return;
                }
                
                // Initialize context on user click
                if (!audioContext) {
                    console.log("Creating new AudioContext...");
                    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
                }
                
                // Always try to resume
                audioContext.resume().then(() => {
                    console.log("AudioContext resumed, sending listen request...");
                    const message = { type: "listen_to_agent", agent_id: id };
                    console.log("Sending message:", message);
                    ws.send(JSON.stringify(message));
                    currentListening = id;
                    renderAgent(id);
                    console.log(`Requesting audio for ${id}...`);
                }).catch(e => {
                    console.error("Error resuming AudioContext:", e);
                });
            }
            // Reset others
            Object.keys(agentsData).forEach(aid => {
                if (aid !== id && currentListening === aid) renderAgent(aid);
            });
        }

        function handleAudio(blob) {
            if (!audioContext) return;
            if (audioContext.state === 'suspended') audioContext.resume();

            blob.arrayBuffer().then(buffer => {
                // DEBUG: Log first few packets to confirm receipt
                if (Math.random() < 0.05) { 
                    console.log(`🔊 RX ${buffer.byteLength} bytes`); 
                }

                // 1. Create Float32 Buffer
                const int16Data = new Int16Array(buffer);
                const float32Data = new Float32Array(int16Data.length);
                
                for (let i = 0; i < int16Data.length; i++) {
                    float32Data[i] = int16Data[i] / 32768.0;
                }
                
                // 2. Schedule Playback
                const audioBuffer = audioContext.createBuffer(1, float32Data.length, SAMPLE_RATE);
                audioBuffer.copyToChannel(float32Data, 0);
                
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioContext.destination);
                source.start();
            }).catch(e => console.error("Audio Decode Error:", e));
        }
    </script>
    <script src="/static/js/dashboard.js" defer></script>
</body>
</html>
