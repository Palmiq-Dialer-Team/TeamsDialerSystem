<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remote Console</title>
    <link rel="stylesheet" href="/static/css/shared.css">
    <link rel="stylesheet" href="/static/css/remote_console.css">
</head>
<body class="remote-console-panel">
    <h1>Remote Console</h1>
    <div class="status">Authenticated. Use with care.</div>
    <div class="actions">
        <button type="button" class="btn-restart"
                onclick="postConsoleAction('/remote-console/restart', 'Restart server now? Existing connections will be drained.', true);">
            Restart Server
        </button>
        <button type="button" class="btn-release"
                onclick="postConsoleAction('/remote-console/push-client-update', 'Run client release script now?');">
            Push Client Update
        </button>
    </div>
    <div id="action-status" class="status"></div>
    <div class="status">Recent logs:</div>
    <div id="log-container" class="log-container">Loading logs...</div>

    <script>
        window.CSRF_TOKEN = "{{ csrf_token }}";
    </script>
    <script src="/static/js/remote_console.js" defer></script>
</body>
</html>
